services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/detection.db}
      UPLOAD_DIR: /data/uploads
      EXPORT_DIR: /data/exports
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-dsv4f}
    volumes:
      - ./data:/data
      - ./backend/templates:/app/templates:ro
    # SQL Server 在 Windows 宿主机时取消注释:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
