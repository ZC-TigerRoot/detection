# Windows Server 2019 + Docker 推荐用法见 docs/DEPLOY-Windows.md
services:
  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      UPLOAD_DIR: /data/uploads
      EXPORT_DIR: /data/exports
    volumes:
      - ./data:/data
      - ./backend/templates:/app/templates:ro
    # 容器内访问 Windows 宿主机上的 SQL Server
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - api
